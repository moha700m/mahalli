name: Mahalli
options:
  bundleIdPrefix: com.justmgz
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: ar

packages:
  # MLX runtime stack (same pins as upstream; see upstream notes in NOTICE).
  # The PrismML fork is required for the 1-bit Bonsai presets.
  mlx-swift:
    url: https://github.com/PrismML-Eng/mlx-swift.git
    revision: e40e0a57a6f7ad08dc3fd87ad598a7aa6407d230
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.31.4"
  swift-transformers-mlx:
    url: https://github.com/DePasqualeOrg/swift-transformers-mlx
    from: "0.2.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    CLANG_ENABLE_MODULES: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_TREAT_IMPLICIT_FUNCTION_DECLARATIONS_AS_ERRORS: YES
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: YES

targets:
  Mahalli:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: IOSLocalLLM
        excludes:
          - "**/*.mlmodelc"
          - "**/FastVLM-0.5B-fp16/**"
          - "**/yolo11n.mlpackage"
          - "**/*.md"
          - "**/*.bin"
          - "**/*.gguf"
          - "**/*.safetensors"
          - "**/*.mlpackage"
          - "**/*.onnx"
          - "**/*.npz"
          - "**/*.pkg"
          - "Resources/BundledVLM/**"
          - "Resources/BundledVoiceModels/**"
          # Core AI (Apple coreai-models preview) belongs to the upstream
          # separate "Core AI" app and is not part of this product.
          - "Services/CoreAILanguageModelService.swift"
          - "Services/CoreAIVisionService.swift"
          # Info.plist / entitlements are referenced via build settings.
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: Mahalli
        PRODUCT_BUNDLE_IDENTIFIER: com.justmgz.mahalli
        INFOPLIST_FILE: IOSLocalLLM/Info.plist
        CODE_SIGN_ENTITLEMENTS: IOSLocalLLM/IOSLocalLLM.entitlements
        CODE_SIGN_STYLE: Automatic
        VERSIONING_SYSTEM: apple-generic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/IOSLocalLLM/Services/LlamaCpp/IOSLocalLLM-Bridging-Header.h"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/ThirdParty/llama.cpp/build-apple"
          - "$(SRCROOT)/ThirdParty/whisper.cpp/build-apple"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/ThirdParty/llama.cpp/tools/mtmd"
          - "$(SRCROOT)/ThirdParty/llama.cpp/include"
          - "$(SRCROOT)/ThirdParty/llama.cpp/ggml/include"
          - "$(SRCROOT)/ThirdParty/whisper.cpp/include"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXVLM
      - package: swift-transformers-mlx
        product: MLXLMTransformers
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXRandom
      - package: mlx-swift
        product: MLXFast
      - framework: ThirdParty/llama.cpp/build-apple/llama.xcframework
        embed: true
      - framework: ThirdParty/whisper.cpp/build-apple/whisper.xcframework
        embed: true
      - target: MahalliShare
        embed: true

  MahalliShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: IOSLocalLLMShareExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: MahalliShare
        PRODUCT_BUNDLE_IDENTIFIER: com.justmgz.mahalli.share
        INFOPLIST_FILE: IOSLocalLLMShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: IOSLocalLLMShareExtension/IOSLocalLLMShareExtension.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  Mahalli:
    build:
      targets:
        Mahalli: all
    run:
      config: Debug
    archive:
      config: Release
