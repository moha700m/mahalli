# Copyright (c) 2026 justmgz
# Builds an UNSIGNED Mahalli.ipa (for sideloading / re-signing) and uploads it
# as a workflow artifact. No secrets or signing identities are used.
name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The sources use iOS 26 SDK APIs, so Xcode 26 is required.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SCHEME: Mahalli
      CONFIGURATION: Release
    steps:
      - name: Checkout (with llama.cpp / whisper.cpp submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select newest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Cache native XCFrameworks
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty/llama.cpp/build-apple/llama.xcframework
            ThirdParty/whisper.cpp/build-apple/whisper.xcframework
          key: native-v1-${{ hashFiles('.gitmodules', 'Patches/**', 'scripts/build_native_frameworks.sh', 'scripts/native/**') }}

      - name: Build llama.cpp + whisper.cpp XCFrameworks
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./scripts/build_native_frameworks.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods (only if a Podfile exists)
        run: |
          if [ -f Podfile ]; then
            gem list -i cocoapods >/dev/null || sudo gem install cocoapods
            pod install
          else
            echo "No Podfile (the app has no CocoaPods dependencies) — skipping pod install"
          fi

      - name: Resolve Swift packages
        run: |
          if [ -d Mahalli.xcworkspace ]; then XC_TARGET="-workspace Mahalli.xcworkspace"; else XC_TARGET="-project Mahalli.xcodeproj"; fi
          echo "XC_TARGET=$XC_TARGET" >> "$GITHUB_ENV"
          xcodebuild $XC_TARGET -scheme "$SCHEME" -resolvePackageDependencies \
            -skipPackagePluginValidation -skipMacroValidation

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild $XC_TARGET \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Mahalli.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*deprecated|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log" || {
            echo "::error::xcodebuild archive failed"
            grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -100
            exit 1
          }

      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/Mahalli.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP_PATH" || { echo "::error::No .app in archive"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Mahalli-unsigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/Mahalli-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mahalli-unsigned-ipa
          path: Mahalli-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
